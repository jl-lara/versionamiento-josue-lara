<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestor de productos - JOSUE LARA</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Gestor de productos - JOSUE LARA</h1>

    <p class="subtitle">
        Administra tus productos y consulta sus precios.
    </p>

    <div class="container">

        <div class="formContainer">

            <label for="name">Nombre del producto:</label>
            <input
                type="text"
                id="name"
                placeholder="Ingresa el nombre del producto"
            >

            <label for="price">Precio:</label>
            <input
                type="number"
                id="price"
                placeholder="Ingresa el precio"
                min="1"
            >

            <button id="addProduct">Agregar producto</button>

        </div>

        <table id="productsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>
            </tbody>
        </table>

    </div>

    <footer>
        <p>Desarrollado por: JOSUE LARA</p>
    </footer>

    <script src="functions.js"></script>

</body>
</html>
